[project]
name = "civicsim-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "networkx>=3.6.1",
    "openai>=3.13.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
