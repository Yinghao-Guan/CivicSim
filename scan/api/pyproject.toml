[project]
name = "civicsim-scan-api"
version = "0.1.0"
description = "Experimental photo-to-issue service. Isolated from the main backend; safe to delete."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "pillow>=11.3.0",
    "pillow-heif>=1.1.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
